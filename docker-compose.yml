version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-attendance-app
    restart: always
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - PORT=8080
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - WEB_APP_URL=${WEB_APP_URL}
      - DIRECTOR_TELEGRAM_ID=${DIRECTOR_TELEGRAM_ID}
      - TIMEZONE=${TIMEZONE:-Asia/Tashkent}
